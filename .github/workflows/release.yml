name: Cross-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read Version from Release Tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag like v1.2.3; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Job 1: Build Windows (.exe + .msi)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows Binaries & MSI
    needs: release-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Set Cargo Version from Release Tag
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $content = $content -replace '(?m)^version = "[^"]+"$', "version = `"$env:VERSION`""
          Set-Content Cargo.toml -Value $content -NoNewline

      - name: Build Windows Binary (.exe)
        run: cargo build --release

      - name: Build Windows Installer (.msi)
        run: |
          cargo wix init --force
          cargo wix
          Copy-Item target\wix\*.msi .

      - name: Package Windows Zip Archive
        run: |
          mkdir staging
          Copy-Item target/release/wol-gui.exe staging\
          Copy-Item README.md staging\
          Copy-Item LICENSE* staging\
          Compress-Archive -Path staging\* -DestinationPath wol-gui-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            wol-gui-windows-x86_64.zip
            *.msi

  # ------------------------------------------------------------------
  # Job 2: Build Fedora RPM Package
  # ------------------------------------------------------------------
  build-fedora-rpm:
    name: Build Fedora RPM
    needs: release-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
    container:
      image: fedora:latest
    steps:
      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y cargo rpm-build rpmdevtools git desktop-file-utils

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Fedora RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          rpmdev-setuptree
          sed -i "s/^Version:.*/Version:        ${VERSION}/" wol-gui.spec
          git archive --format=tar.gz --prefix=wol-gui-${VERSION}/ HEAD -o ~/rpmbuild/SOURCES/wol-gui-${VERSION}.tar.gz
          cp wol-gui.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/wol-gui.spec
          mkdir -p output
          cp ~/rpmbuild/RPMS/*/*.rpm output/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: output/*.rpm

  # ------------------------------------------------------------------
  # Job 3: Build Debian / Ubuntu DEB Package
  # ------------------------------------------------------------------
  build-debian-deb:
    name: Build Debian DEB
    needs: release-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-version.outputs.version }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Set Cargo Version from Release Tag
        run: sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml

      - name: Build .deb Package
        run: cargo deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: target/debian/*.deb

  # ------------------------------------------------------------------
  # Job 4: Publish GitHub Release
  # ------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [release-version, build-windows, build-fedora-rpm, build-debian-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages

      - name: Download Fedora RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: fedora-rpm

      - name: Download Debian DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
            **/*.msi
            **/*.rpm
            **/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true