name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Add this to allow manual triggers
  
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Job 1: Build Windows (.exe + .msi)
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows Binaries & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset via WiX Action
        run: dotnet tool install --global wix --version 4.0.5

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build Windows Binary (.exe)
        run: cargo build --release

      - name: Build Windows Installer (.msi)
        run: cargo wix

      - name: Package Windows Zip Archive
        run: |
          mkdir staging
          cp target/release/wol-gui.exe staging/
          cp README.md LICENSE-* staging/
          Compress-Archive -Path staging/* -DestinationPath wol-gui-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            wol-gui-windows-x86_64.zip
            target/wix/*.msi

  # ------------------------------------------------------------------
  # Job 2: Build Fedora RPM Package
  # ------------------------------------------------------------------
  build-fedora-rpm:
    name: Build Fedora RPM
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y cargo rpm-build rpmdevtools git desktop-file-utils

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Fedora RPM
        run: |
          # Trust the workspace path inside the Docker container
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          VERSION=${GITHUB_REF_NAME#v}
          rpmdev-setuptree
          git archive --format=tar.gz --prefix=wol-gui-${VERSION}/ HEAD -o ~/rpmbuild/SOURCES/wol-gui-${VERSION}.tar.gz
          sed -i "s/^Version:.*/Version:        ${VERSION}/" wol-gui.spec
          cp wol-gui.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/wol-gui.spec
          mkdir -p output
          cp ~/rpmbuild/RPMS/*/*.rpm output/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm
          path: output/*.rpm

  # ------------------------------------------------------------------
  # Job 3: Build Debian / Ubuntu DEB Package
  # ------------------------------------------------------------------
  build-debian-deb:
    name: Build Debian DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb Package
        run: cargo deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: target/debian/*.deb

  # ------------------------------------------------------------------
  # Job 4: Publish GitHub Release
  # ------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-fedora-rpm, build-debian-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages

      - name: Download Fedora RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: fedora-rpm

      - name: Download Debian DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.msi
            *.rpm
            *.deb
          draft: false
          prerelease: false
          generate_release_notes: true