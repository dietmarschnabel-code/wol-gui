[package]
name = "wol-gui"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Dietmar Schnabel"]
description = "A fast, lightweight, memory-safe cross-platform Wake-on-LAN GUI desktop manager written in Rust."
repository = "https://github.com/dietmarschnabel-code/go-e-sma-homewizard-controller"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
macaddr = "1.0"
serde = { version = "1.0", features = ["derive"] }
fluent-templates = "0.8"
unic-langid = "0.9"
sys-locale = "0.3"
image = { version = "0.24", default-features = false, features = ["png"] }

[package.metadata.deb]
maintainer = "Dietmar Schnabel"
copyright = "2026, Dietmar Schnabel"
license-file = ["LICENSE-MIT", "4"]
extended-description = """\
A lightweight, memory-safe Wake-on-LAN desktop manager built in Rust.
Allows managing target device profiles and sending magic packets across subnets.
"""
section = "net"
priority = "optional"
assets = [
    ["target/release/wol-gui", "usr/bin/", "755"],
    ["wol-gui.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/pixmaps/wol-gui.png", "644"],
]

[package.metadata.wix]
eula = false